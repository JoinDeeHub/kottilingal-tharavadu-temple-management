name: 🔔 Monthly Pooja Reminder

on:
  schedule:
    - cron: '0 4 1 * *'  # 1st of every month at 9:30 AM IST
  workflow_dispatch:

jobs:
  send-reminders:
    name: 📱 Send Monthly Reminders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger reminder API
        run: |
          curl -X POST "${{ secrets.API_URL }}/reminders/send-monthly" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"type": "monthly_pooja"}' || echo "API not reachable, reminder logged"
          echo "🔔 Monthly pooja reminders triggered for $(date)"
